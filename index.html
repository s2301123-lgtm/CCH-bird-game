<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>香港小鳥探險家</title>
  <style>
    body { font-family: sans-serif; background: #f1f8e9; padding: 20px; text-align: center; }
    .card { background: white; border-radius: 15px; padding: 20px; max-width: 450px; margin: 0 auto; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
    h1 { color: #2e7d32; }
    .btn { background: #2e7d32; color: white; border: none; padding: 12px 20px; border-radius: 8px; font-size: 16px; margin: 8px; cursor: pointer; width: 100%; }
    .btn-opt { background: #e8f5e9; color: #1b5e20; border: 1px solid #a5d6a7; }
    .img { width: 100%; max-height: 220px; object-fit: cover; border-radius: 10px; margin: 10px 0; }
    .hide { display: none; }
  </style>
</head>
<body>

<div class="card">
  <div id="start">
    <h1>🦅 香港小鳥探險家</h1>
    <p>觀鳥學會開放日特別版（4-6年級）</p>
    <button class="btn" onclick="startGame()">開始遊戲</button>
  </div>

  <div id="game" class="hide">
    <h3 id="q-title"></h3>
    <img id="q-img" class="img hide" src="" alt="鳥類照片">
    <p id="q-desc"></p>
    <div id="opts"></div>
    <p id="msg" style="font-weight:bold;"></p>
    <button id="next" class="btn hide" onclick="nextQ()">下一題</button>
  </div>

  <div id="end" class="hide">
    <h1>🎉 挑戰完成！</h1>
    <h2 id="score"></h2>
    <button class="btn" onclick="startGame()">再玩一次</button>
  </div>
</div>
