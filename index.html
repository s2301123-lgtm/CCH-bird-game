<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>香港小鳥探險家</title>
  <style>
    body { font-family: sans-serif; background: #e8f5e9; padding: 20px; text-align: center; }
    .card { background: white; border-radius: 15px; padding: 20px; max-width: 400px; margin: auto; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
    button { background: #2e7d32; color: white; border: none; padding: 12px; margin: 8px 0; width: 100%; border-radius: 8px; font-size: 16px; font-weight: bold; }
    .opt { background: #f0f4f8; color: #333; border: 1px solid #ccc; }
    img { width: 100%; max-height: 200px; object-fit: cover; border-radius: 8px; margin: 10px 0; }
    .hide { display: none; }
  </style>
</head>
<body>

<div class="card">
  <div id="start">
    <h2>🦅 香港小鳥探險家</h2>
    <p>觀鳥學會開放日遊戲</p>
    <button onclick="start()">開始遊戲</button>
  </div>

  <div id="game" class="hide">
    <h3 id="title"></h3>
    <img id="img" src="" class="hide">
    <p id="desc"></p>
    <div id="opts"></div>
    <p id="ans-msg" style="font-weight:bold;"></p>
    <button id="next-btn" class="hide" onclick="next()">下一題</button>
  </div>

  <div id="end" class="hide">
    <h2>🎉 遊戲結束！</h2>
    <h3 id="final"></h3>
    <button onclick="start()">再玩一次</button>
  </div>
</div>

<script>
  const qList = [
    { t: "第 1 題", img: "https://upload.wikimedia.org/wikipedia/commons/thumb/8/87/Black-collared_starling_%28Gracupica_nigricollis%29_juvenile.jpg/640px-Black-collared_starling_%28Gracupica_nigricollis%29_juvenile.jpg", d: "眼周有黃色裸皮，幼鳥脖子褐色，長大有黑色領巾：", o: ["黑領椋鳥", "紅耳鵯", "麻雀", "珠頸斑鳩"], a: 0 },
    { t: "第 2 題", img: "https://upload.wikimedia.org/wikipedia/commons/thumb/c/c9/White-breasted_Waterhen_%28Amaurornis_phoenicurus%29_in_Kolkata_I_IMG_6881.jpg/640px-White-breasted_Waterhen_%28Amaurornis_phoenicurus%29_in_Kolkata_I_IMG_6881.jpg", d: "常在濕地出現，叫聲「苦惡、苦惡」：", o: ["白胸苦惡鳥", "小白鷺", "喜鵲", "蒼鷺"], a: 0 },
    { t: "第 3 題", img: "https://upload.wikimedia.org/wikipedia/commons/thumb/e/e4/Red-whiskered_Bulbul_%28Pycnonotus_jocosus%29_in_Kolkata_W_IMG_3822.jpg/640px-Red-whiskered_Bulbul_%28Pycnonotus_jocosus%29_in_Kolkata_W_IMG_3822.jpg", d: "頭頂有高聳黑色冠羽，臉頰有醒目紅斑：", o: ["噪鶇", "紅耳鵯", "小白鷺", "八哥"], a: 1 },
    { t: "第 4 題", img: "", d: "在野外觀鳥時，哪種行為是錯誤的？", o: ["保持安靜", "使用望遠鏡", "大聲叫喊吸引鳥類", "不餵食"], a: 2 },
    { t: "第 5 題", img: "https://upload.wikimedia.org/wikipedia/commons/thumb/e/e2/Spotted_dove_%28Spilopelia_chinensis_chinensis%29.jpg/640px-Spotted_dove_%28Spilopelia_chinensis_chinensis%29.jpg", d: "後頸有黑底白點圍巾羽毛，常在地面走動：", o: ["珠頸斑鳩", "家鴿", "黑臉琵鷺", "普通翠鳥"], a: 0 }
  ];

  let idx = 0, score = 0;

  function start() {
    idx = 0; score = 0;
    document.getElementById("start").classList.add("hide");
    document.getElementById("end").classList.add("hide");
    document.getElementById("game").classList.remove("hide");
    loadQ();
  }

  function loadQ() {
    document.getElementById("next-btn").classList.add("hide");
    document.getElementById("ans-msg").innerText = "";
    const q = qList[idx];
    document.getElementById("title").innerText = q.t;
    document.getElementById("desc").innerText = q.d;
    
    const img = document.getElementById("img");
    if(q.img) { img.src = q.img; img.classList.remove("hide"); } 
    else { img.classList.add("hide"); }

    const box = document.getElementById("opts");
    box.innerHTML = "";
    q.o.forEach((optText, i) => {
      box.innerHTML += `<button class="opt" onclick="check(${i})">${optText}</button>`;
    });
  }

  function check(i) {
    const q = qList[idx];
    if(i === q.a) {
      score += 20;
      document.getElementById("ans-msg").innerText = "✨ 答對了！";
      document.getElementById("ans-msg").style.color = "green";
    } else {
      document.getElementById("ans-msg").innerText = "❌ 答錯！答案是：" + q.o[q.a];
      document.getElementById("ans-msg").style.color = "red";
    }
    document.getElementById("next-btn").classList.remove("hide");
  }

  function next() {
    idx++;
    if(idx < q.length) loadQ();
    else {
      document.getElementById("game").classList.add("hide");
      document.getElementById("end").classList.remove("hide");
      document.getElementById("final").innerText = "得分：" + score + " 分";
    }
  }
</script>
</body>
</html>
